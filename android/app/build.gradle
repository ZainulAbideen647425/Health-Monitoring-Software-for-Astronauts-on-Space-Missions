plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.astronaut.healthmonitor'
    compileSdk 34
    defaultConfig {
        applicationId 'com.astronaut.healthmonitor'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '2.0'
        ndk { abiFilters 'arm64-v8a' }
        python {
            version '3.12'
            pip {
                install 'fastapi'
                install 'uvicorn'
                install 'sqlalchemy'
                install 'pydantic'
                install 'pydantic-settings'
                install 'cryptography'
                install 'numpy'
                install 'pandas'
                install 'scikit-learn'
            }
            extractPackages 'astronaut_health_monitor'
        }
    }
    sourceSets {
        main { python.srcDir '../../src' }
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
